name: Lambda restart Staging

on:
  workflow_dispatch:

env: 
  AWS_REGION: ca-central-1
  FUNCTION_NAME: cds-superset-docs

permissions: {}

jobs:
  lambda-restart:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
        DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
        DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
        DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
        DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
        DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_CL
        DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
        DNS_PROXY_WILDCARDGREEDY: "true"

    - name: Configure aws credentials using OIDC
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ vars.STAGING_AWS_ACCOUNT_ID }}:role/cds-superset-docs-apply
        role-session-name: RestartLambda
        aws-region: ${{ env.AWS_REGION }}

    - name: Restart Lambda function
      run: |
        aws lambda update-function-configuration \
          --function-name ${{ env.FUNCTION_NAME }} \
          --description "Updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > /dev/null 2>&1

  cache-invalidate:
    needs: lambda-restart
    permissions:
      id-token: write
    uses: ./.github/workflows/cache-invalidate.yml
    with:
      aws_account_id: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
    secrets:
      SENTINEL_DCE_ENDPOINT: ${{ secrets.SENTINEL_DCE_ENDPOINT }}

